version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dam-postgres
    environment:
      POSTGRES_DB: dam_db
      POSTGRES_USER: dam_user
      POSTGRES_PASSWORD: dam_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dam-network

  minio:
    image: minio/minio:latest
    container_name: dam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dam-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dam-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dam-network

  redis:
    image: redis:7-alpine
    container_name: dam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dam-network

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  redis_data:

networks:
  dam-network:
    driver: bridge